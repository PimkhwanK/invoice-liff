<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ออกบิล</title>
<link rel="stylesheet" href="form.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<!-- แอป LIFF หน้าเดียว (รอบ 6 ข้อ 3.5): issue.html / history.html / manage.html / view.html เป็นไฟล์เดียวกันทุกตัวอักษร
     หน้าจอที่แสดงเลือกจาก path (shell.js) แล้วสลับหน้าจอในแอปโดยไม่โหลดหน้าใหม่ — แก้ไฟล์นี้แล้วต้องคัดลอกทับอีก 3 ไฟล์ -->
<div class="wrap" id="app">
  <div class="screen"><div class="topbar"><h1>กำลังเปิด…</h1></div>
  <div id="view"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span><div class="msg">กำลังเปิดหน้า…</div></div></div></div>
</div>
<div id="dock"></div>
<nav class="tabbar hidden" id="tabbar" aria-label="เมนู">
  <button type="button" data-go="issue"><i data-icon="issue"></i><span>ออกบิล</span></button>
  <button type="button" data-go="history"><i data-icon="history"></i><span>ประวัติ</span></button>
  <button type="button" data-go="manage"><i data-icon="manage"></i><span>จัดการข้อมูล</span></button>
</nav>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="money.js"></script>
<script src="bahtText.js"></script>
<script src="thaiDate.js"></script>
<script src="address.js"></script>
<script src="invoice.js"></script>
<script src="preview.js"></script>
<script src="search.js"></script>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="appdata.js"></script>
<script src="shell.js"></script>
<script src="issue.js"></script>
<script src="history.js"></script>
<script src="manage.js"></script>
<script src="view.js"></script>
<script>
  // ตรวจว่าไฟล์ทุกไฟล์โหลดครบก่อนเริ่มแอป (รอบ 6 ข้อ 4 ต่อ) — เน็ตช้า/หลุดจนไฟล์หนึ่งโหลดไม่สำเร็จ เบราว์เซอร์จะข้ามไฟล์นั้นแล้วรันไฟล์ถัดไป
  // (เดิม: หน้าวาดไม่ครบเงียบ ๆ เช่น "fromSatang is not defined" หรือค้างที่ "กำลังเปิด…")
  // ไม่ครบ → โหลดใหม่อัตโนมัติ 1 ครั้ง (ภายใน 1 นาที) / ยังไม่ครบ → บอกผู้ใช้ + ปุ่มลองใหม่ — โค้ดนี้อยู่ในหน้าเอง ไม่พึ่งไฟล์อื่น
  (function (need, start) {
    var KEY = 'invoice-liff:reload';
    var missing = [];
    for (var i = 0; i < need.length; i++) {
      var ok = false;
      try { ok = need[i][1](); } catch (e) { ok = false; }
      if (!ok) missing.push(need[i][0]);
    }
    if (!missing.length) {
      try { sessionStorage.removeItem(KEY); } catch (e) { /* ไม่เป็นไร */ }
      return start();
    }
    try {
      if (Date.now() - (Number(sessionStorage.getItem(KEY)) || 0) > 60000) {
        sessionStorage.setItem(KEY, String(Date.now()));
        return location.reload();
      }
    } catch (e) { /* sessionStorage ใช้ไม่ได้ → แสดงข้อความเลย (กันโหลดใหม่วนไม่จบ) */ }
    var box = document.getElementById('app') || document.getElementById('view') || document.body;
    box.innerHTML = '<section class="card alert err" id="error" data-code="load_failed" role="alert"><h2>เปิดหน้าไม่สำเร็จ</h2>' +
      '<p>ตรวจสอบอินเทอร์เน็ต แล้วลองอีกครั้ง</p>' +
      '<button type="button" class="btn primary block" id="error-action">ลองอีกครั้ง</button></section>';
    try { console.error('[ผู้ดูแลระบบ] โหลดไม่สำเร็จ: ' + missing.join(', ')); } catch (e) { /* ไม่เป็นไร */ }
    document.getElementById('error-action').addEventListener('click', function () { location.reload(); });
  })([
    ['form.css', function () { return getComputedStyle(document.documentElement).getPropertyValue('--radius') !== ''; }],
    ['theme.css', function () { return getComputedStyle(document.documentElement).getPropertyValue('--theme-primary') !== ''; }],
    ['config.js', function () { return !!window.APP_CONFIG; }],
    ['money.js', function () { return typeof toSatang === 'function' && typeof fromSatang === 'function' && typeof formatMoney === 'function'; }],
    ['bahtText.js', function () { return typeof bahtText === 'function'; }],
    ['thaiDate.js', function () { return typeof formatThaiDate === 'function'; }],
    ['address.js', function () { return typeof splitAddress === 'function'; }],
    ['invoice.js', function () { return typeof validateDocumentInput === 'function'; }],
    ['preview.js', function () { return typeof previewLocal === 'function'; }],
    ['search.js', function () { return typeof searchShops === 'function'; }],
    ['icons.js', function () { return typeof iconSvg === 'function'; }],
    ['common.js', function () { return typeof LiffApp === 'object'; }],
    ['appdata.js', function () { return typeof AppData === 'object'; }],
    ['shell.js', function () { return typeof Shell === 'object'; }],
    ['issue.js', function () { return Shell.has('issue'); }],
    ['history.js', function () { return Shell.has('history'); }],
    ['manage.js', function () { return Shell.has('manage'); }],
    ['view.js', function () { return Shell.has('view'); }]
  ], function () { Shell.boot(); });
</script>
</body>
</html>
