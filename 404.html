<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ไม่พบหน้านี้</title>
<script>
  // GitHub Pages เปิด /issue ได้ (issue.html) แต่ /issue/ (มี / ท้าย) ไม่ได้ → ตัด / ท้ายแล้วเปิดใหม่ โดยเก็บ ?... และ #... ไว้
  (function () {
    var p = location.pathname;
    if (p.length > 1 && p.charAt(p.length - 1) === '/' && p.split('/').length > 3) {
      location.replace(p.slice(0, -1) + location.search + location.hash);
    }
  })();
</script>
<link rel="stylesheet" href="/invoice-liff/form.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"><h1>ไม่พบหน้านี้</h1></div>
  <section class="card"><p>ลิงก์นี้ไม่ถูกต้อง กรุณาเปิดจากเมนูในแชท LINE</p></section>
</div>
</body>
</html>
