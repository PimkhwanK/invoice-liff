<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>ตรวจระบบ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>ตรวจระบบ</h1>
      <div class="muted small">สำหรับผู้ดูแลระบบ · ตรวจการเชื่อมต่อ LINE → Google Sheets (อ่านอย่างเดียว)</div>
    </header>

    <main id="view" aria-live="polite">
      <div class="card empty" id="loading">กำลังเปิดหน้า…</div>
    </main>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="search.js"></script>
  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
  <script>
    // ตรวจว่าไฟล์ทุกไฟล์โหลดครบก่อนเริ่มแอป (รอบ 6 ข้อ 4 ต่อ) — เน็ตช้า/หลุดจนไฟล์หนึ่งโหลดไม่สำเร็จ เบราว์เซอร์จะข้ามไฟล์นั้นแล้วรันไฟล์ถัดไป
    // (เดิม: หน้าวาดไม่ครบเงียบ ๆ เช่น "fromSatang is not defined" หรือค้างที่ "กำลังเปิด…")
    // ไม่ครบ → โหลดใหม่อัตโนมัติ 1 ครั้ง (ภายใน 1 นาที) / ยังไม่ครบ → บอกผู้ใช้ + ปุ่มลองใหม่ — โค้ดนี้อยู่ในหน้าเอง ไม่พึ่งไฟล์อื่น
    (function (need, start) {
      var KEY = 'invoice-liff:reload';
      var missing = [];
      for (var i = 0; i < need.length; i++) {
        var ok = false;
        try { ok = need[i][1](); } catch (e) { ok = false; }
        if (!ok) missing.push(need[i][0]);
      }
      if (!missing.length) {
        try { sessionStorage.removeItem(KEY); } catch (e) { /* ไม่เป็นไร */ }
        return start();
      }
      try {
        if (Date.now() - (Number(sessionStorage.getItem(KEY)) || 0) > 60000) {
          sessionStorage.setItem(KEY, String(Date.now()));
          return location.reload();
        }
      } catch (e) { /* sessionStorage ใช้ไม่ได้ → แสดงข้อความเลย (กันโหลดใหม่วนไม่จบ) */ }
      var box = document.getElementById('app') || document.getElementById('view') || document.body;
      box.innerHTML = '<section class="card alert err" id="error" data-code="load_failed" role="alert"><h2>โหลดหน้าไม่ครบ</h2>' +
        '<p>อินเทอร์เน็ตอาจช้าหรือหลุดระหว่างเปิดหน้า กรุณากด "ลองใหม่"</p><div class="detail" id="error-detail"></div>' +
        '<button type="button" class="btn primary block" id="error-action">ลองใหม่</button></section>';
      document.getElementById('error-detail').textContent = 'รายละเอียดสำหรับผู้ดูแลระบบ: โหลดไม่สำเร็จ ' + missing.join(', ');
      document.getElementById('error-action').addEventListener('click', function () { location.reload(); });
    })([
      ['style.css', function () { return getComputedStyle(document.documentElement).getPropertyValue('--radius') !== ''; }],
      ['theme.css', function () { return getComputedStyle(document.documentElement).getPropertyValue('--theme-primary') !== ''; }],
      ['config.js', function () { return !!window.APP_CONFIG; }],
      ['search.js', function () { return typeof searchShops === 'function'; }],
      ['icons.js', function () { return typeof iconSvg === 'function'; }],
      ['common.js', function () { return typeof LiffApp === 'object'; }],
      ['app.js', function () { return typeof CheckApp === 'object'; }]
    ], function () { CheckApp.start(); });
  </script>
</body>
</html>
